<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وەرگێڕی دەنگی کوردی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.4rem;margin:8px 0 12px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px;width:100%;max-width:480px;margin-bottom:12px}
label{font-size:.8rem;color:#a8d8ea;display:block;margin:8px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #4a7c9b;background:rgba(0,0,0,.35);color:#fff;font-size:.95rem;direction:ltr}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#1a7f5a;color:#fff;font-size:1rem;margin-top:10px;font-weight:bold}
#mic{width:130px;height:130px;border-radius:50%;border:none;font-size:2.8rem;background:radial-gradient(circle at 30% 30%,#ff6b6b,#c0392b);margin:12px 0 6px;color:#fff}
#mic.on{background:radial-gradient(circle at 30% 30%,#2ecc71,#1a7f5a);animation:p 1.6s infinite}
@keyframes p{50%{transform:scale(1.06)}}
#st{font-size:.9rem;color:#ffd166;min-height:22px;text-align:center}
#txt{width:100%;max-width:480px;font-size:1.1rem;line-height:1.8;margin-top:10px;max-height:40vh;overflow-y:auto}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>🎙️ وەرگێڕی دەنگی کوردی</h1>

<div class="card" id="setup">
  <label>کلیلی Gemini</label>
  <input type="password" id="key" placeholder="API Key" autocomplete="off">
  <label>مۆدێل</label>
  <select id="model">
    <option>gemini-3.5-live-translate-preview</option>
  </select>
  <button class="btn" id="save">پاشەکەوتکردن</button>
</div>

<div id="main" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
  <div id="st">ئامادەیە</div>
  <button id="mic">🎤</button>
  <div id="txt"></div>
  <button class="btn" id="cfg" style="max-width:200px;background:#34495e">ڕێکخستنەکان</button>
</div>

<script>
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let ws=null,ready=false,want=false,mic=null,actx=null,pctx=null,node=null,acc=[],accLen=0,nextT=0,retry=0;

if(ls.get('k'))$('key').value=ls.get('k');
if(ls.get('m'))$('model').value=ls.get('m');
if(ls.get('k'))show();

$('save').onclick=()=>{
  const k=$('key').value.trim();
  if(!k)return alert('کلیلەکە بنووسە');
  ls.set('k',k);ls.set('m',$('model').value);show();
};
$('cfg').onclick=()=>{stop();$('main').classList.add('hidden');$('setup').classList.remove('hidden')};
$('mic').onclick=()=>want?stop():start();
function show(){$('setup').classList.add('hidden');$('main').classList.remove('hidden')}
function st(t){$('st').textContent=t}

async function start(){
  want=true;$('mic').classList.add('on');
  pctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:24000});
  pctx.resume();nextT=0;
  try{
    mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:true,channelCount:1}});
    actx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
    const code="class P extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('p',P)";
    await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:'application/javascript'})));
    node=new AudioWorkletNode(actx,'p');
    node.port.onmessage=e=>feed(e.data);
    actx.createMediaStreamSource(mic).connect(node);
  }catch(err){st('❌ مایکرۆفۆن: '+err.message);stop();return}
  connect();
}

function stop(){
  want=false;ready=false;$('mic').classList.remove('on');
  try{node&&node.disconnect()}catch(e){}
  try{actx&&actx.close()}catch(e){}
  try{mic&&mic.getTracks().forEach(t=>t.stop())}catch(e){}
  try{ws&&ws.close()}catch(e){}
  try{pctx&&pctx.close()}catch(e){}
  node=actx=mic=ws=pctx=null;acc=[];accLen=0;st('وەستا');
}

function connect(){
  st('🔄 پەیوەندیکردن...');
  ws=new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key="+ls.get('k'));
  const mine=ws;
  ws.onopen=()=>mine.send(JSON.stringify({setup:{
    model:'models/'+ls.get('m'),
    generationConfig:{responseModalities:['AUDIO'],inputAudioTranscription:{},outputAudioTranscription:{},
      translationConfig:{targetLanguageCode:'ckb',echoTargetLanguage:false}}
  }}));
  ws.onmessage=async ev=>{
    let d=ev.data;if(d instanceof Blob)d=await d.text();
    let m;try{m=JSON.parse(d)}catch(e){return}
    if(m.setupComplete){retry=0;ready=true;st('✅ گوێم لێیە — ئینگلیزی بپەخشە');return}
    if(m.error){st('❌ '+(m.error.message||'هەڵە').slice(0,200));return}
    const sc=m.serverContent;if(!sc)return;
    if(sc.outputTranscription&&sc.outputTranscription.text){
      const t=$('txt');t.textContent+=sc.outputTranscription.text;
      if(t.textContent.length>600)t.textContent=t.textContent.slice(-400);
      t.scrollTop=t.scrollHeight;
    }
    if(sc.modelTurn&&sc.modelTurn.parts)for(const p of sc.modelTurn.parts)if(p.inlineData&&p.inlineData.data)play(p.inlineData.data);
    if(sc.interrupted)nextT=0;
  };
  ws.onclose=()=>{
    if(mine!==ws)return;
    ready=false;
    if(want){const d=Math.min(15000,1000*Math.pow(2,retry++));st('🔄 دووبارە دەبەستمەوە');setTimeout(()=>{if(want)connect()},d)}
  };
  ws.onerror=()=>st('❌ هەڵەی پەیوەندی — ئینتەرنێت و کلیلەکە بپشکنە');
}

/* مایک: هەر ٤٠ میلی‌چرکە یەک پارچە */
function feed(f){
  if(!ready||!ws||ws.readyState!==1)return;
  acc.push(f);accLen+=f.length;
  if(accLen<Math.round(actx.sampleRate*0.04))return;
  const all=new Float32Array(accLen);let o=0;for(const a of acc){all.set(a,o);o+=a.length}
  acc=[];accLen=0;
  const n=640,ratio=all.length/n,out=new Int16Array(n);
  for(let i=0;i<n;i++){
    const a=Math.floor(i*ratio),b=Math.max(a+1,Math.floor((i+1)*ratio));let t=0;
    for(let j=a;j<b&&j<all.length;j++)t+=all[j];
    const v=Math.max(-1,Math.min(1,t/(b-a)*2));
    out[i]=v<0?v*32768:v*32767;
  }
  const by=new Uint8Array(out.buffer);let bin='';
  for(let i=0;i<by.length;i+=8192)bin+=String.fromCharCode.apply(null,by.subarray(i,i+8192));
  ws.send(JSON.stringify({realtimeInput:{audio:{mimeType:"audio/pcm;rate=16000",data:btoa(bin)}}}));
}

/* پەخشکردنی دەنگی کوردی: بافەری بچووک بۆ بێ‌پچڕانی */
function play(b64){
  if(!pctx)return;
  const bin=atob(b64),by=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
  const i16=new Int16Array(by.buffer),f=new Float32Array(i16.length);
  for(let i=0;i<i16.length;i++)f[i]=i16[i]/32768;
  const buf=pctx.createBuffer(1,f.length,24000);buf.copyToChannel(f,0);
  const s=pctx.createBufferSource();s.buffer=buf;s.connect(pctx.destination);
  const now=pctx.currentTime;
  if(nextT<now)nextT=now+0.15;
  s.start(nextT);nextT+=buf.duration;
}
</script>
</body>
</html>
