<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وەرگێڕی دەنگی کوردی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
.sub{color:#8fd3f4;font-size:.85rem;margin-bottom:12px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px;width:100%;max-width:480px;margin-bottom:12px}
label{font-size:.8rem;color:#a8d8ea;display:block;margin:8px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #4a7c9b;background:rgba(0,0,0,.35);color:#fff;font-size:.95rem;direction:ltr}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#1a7f5a;color:#fff;font-size:1rem;margin-top:10px;font-weight:bold}
.btn:disabled{background:#555}
.row{display:flex;gap:8px;align-items:center;font-size:.85rem;margin-top:10px}
.row input{width:auto}
#main{width:100%;display:flex;flex-direction:column;align-items:center}
#mic{width:130px;height:130px;border-radius:50%;border:none;font-size:2.8rem;background:radial-gradient(circle at 30% 30%,#ff6b6b,#c0392b);box-shadow:0 8px 24px rgba(192,57,43,.5);margin:12px 0 6px;color:#fff}
#mic.on{background:radial-gradient(circle at 30% 30%,#2ecc71,#1a7f5a);box-shadow:0 8px 24px rgba(46,204,113,.5);animation:p 1.6s infinite}
@keyframes p{50%{transform:scale(1.06)}}
#mic:disabled{opacity:.5}
#st{font-size:.9rem;color:#ffd166;min-height:22px;text-align:center;max-width:480px;word-break:break-word}
#log{width:100%;max-width:480px;max-height:42vh;overflow-y:auto;margin-top:8px}
.pair{background:rgba(26,127,90,.3);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.en{direction:ltr;text-align:left;font-size:.75rem;color:#9fb8c4;margin-bottom:3px}
.ku{font-size:calc(1.05rem*var(--fs,1));line-height:1.7}
#lvlw{width:100%;max-width:300px;height:8px;background:rgba(255,255,255,.12);border-radius:4px;margin-top:8px;overflow:hidden}
#lvl{height:100%;width:0;background:#7f8c8d}
.bar{display:flex;gap:8px;width:100%;max-width:480px;margin-top:10px}
.bar button{flex:1;padding:9px;border:none;border-radius:10px;background:#34495e;color:#fff;font-size:.85rem}
#stat{font-size:.72rem;color:#7f9aa8;margin-top:6px;min-height:14px}
.hint{font-size:.75rem;color:#8aa5b3;text-align:center;max-width:480px;margin-top:6px;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>🎙️ وەرگێڕی دەنگی کوردی</h1>
<div class="sub">ئینگلیزی دەبیسترێت، یەکسەر بە کوردی دەگوترێتەوە</div>

<div class="card" id="setup">
  <label>کلیلی Gemini (خۆڕایە لە aistudio.google.com)</label>
  <input type="password" id="key" placeholder="API Key" autocomplete="off">
  <label>مۆدێل</label>
  <select id="model">
    <option>gemini-2.5-flash-native-audio-preview-12-2025</option>
    <option>gemini-3.1-flash-live-preview</option>
    <option>gemini-2.5-flash-native-audio-preview-09-2025</option>
  </select>
  <label>خێرایی دەنگی کوردی</label>
  <select id="speed"><option value="1">ئاسایی</option><option value="1.15">خێرا</option><option value="1.3">زۆر خێرا</option></select>
  <label>جێگیری دەنگی کوردی (دژی پچڕان)</label>
  <select id="buf"><option value="200">کەم — خێراترین</option><option value="400">ناوەند — پێشنیارکراو</option><option value="700">زۆر — بێ پچڕانترین</option></select>
  <label>مۆدی مایک</label>
  <select id="mm"><option value="n">ئاسایی — بۆ یاری (پێشنیارکراو)</option><option value="c">پاککردنەوەی دەنگی پشتەوە</option><option value="o">خاو — بێ دەستکاری</option></select>
  <label>بەرزکردنەوەی دەنگی مایک</label>
  <select id="mg"><option value="1">×1</option><option value="2">×2</option><option value="3">×3</option><option value="4">×4</option></select>
  <label>هەستیاری گوێگرتن</label>
  <select id="sn"><option value="0.004">زۆر هەستیار</option><option value="0.008">ناوەند</option><option value="0.015">کەم</option></select>
  <label>بڕینی ڕستەکان (ڕێکخستنی ڕستە)</label>
  <select id="seg"><option value="250">زۆر خێرا — ڕستەی کورت</option><option value="600">ڕێکخراو — پێشنیارکراو</option><option value="1000">وردتر — دواکەوتنی زیاتر</option></select>
  <label>بەرزی دەنگی کوردی</label>
  <input type="range" id="vol" min="0.2" max="1" step="0.1" value="1">
  <div class="row"><input type="checkbox" id="mute"><span>مایک بکوژێنەوە کاتێک کوردی دەگوترێت (ئەگەر هێدفۆن نییە)</span></div>
  <label>شێوازی وەرگێڕان</label>
  <select id="md"><option value="a">دوو قۆناغ — تێگەیشتنی وردتر (پێشنیارکراو)</option><option value="f">یەک قۆناغ — خێراتر</option></select>
  <label>مۆدێلی تێگەیشتن و وەرگێڕان (قۆناغی یەکەم)</label>
  <select id="tm"><option>gemini-2.5-flash</option><option>gemini-2.5-pro</option><option>gemini-2.5-flash-lite</option></select>
  <label>دەنگی وەرگێڕ</label>
  <select id="vc"><option>Aoede</option><option>Kore</option><option>Puck</option><option>Charon</option><option>Fenrir</option><option>Leda</option><option>Zephyr</option><option>Orus</option></select>
  <label>فەرهەنگی تایبەت بە یاری (هەر دێڕێک: English = کوردی)</label>
  <textarea id="gl" rows="4" placeholder="Health = ژیان&#10;Ammo = فیشەک" style="width:100%;padding:10px;border-radius:10px;border:1px solid #4a7c9b;background:rgba(0,0,0,.35);color:#fff;font-size:.9rem"></textarea>
  <label>قەبارەی نووسین</label>
  <select id="fs"><option value="1">ئاسایی</option><option value="1.25">گەورە</option><option value="1.5">زۆر گەورە</option></select>
  <div class="row"><input type="checkbox" id="en" checked><span>نیشاندانی نووسینی ئینگلیزی</span></div>
  <button class="btn" id="save">پاشەکەوتکردن</button>
</div>

<div id="main" class="hidden">
  <div id="st">ئامادەیە</div>
  <button id="mic">🎤</button>
  <div id="lvlw"><div id="lvl"></div></div>
  <div class="hint">یەکجار دایبگرە بۆ دەستپێکردن، دووبارە دایبگرە بۆ وەستاندن. بۆ باشترین ئەنجام هێدفۆن بەکاربهێنە.</div>
  <div id="stat"></div>
  <div class="bar"><button id="clr">🗑️ پاککردنەوە</button><button id="cpy">📋 کۆپی</button></div>
  <div id="log"></div>
  <button class="btn" id="cfg" style="max-width:200px;background:#34495e">ڕێکخستنەکان</button>
</div>

<script>
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let ws=null,ready=false,want=false,mic=null,actx=null,node=null,acc=[],accLen=0;
let gain=null,pctx=null,pnode=null,cur=null,speaking=false;
let speakQ=[],busyT=false,lastEn=[];
let resumeH=null,retry=0,pendingReset=false,wl=null,tAct=0,lats=[],histLoaded=false;
let queue=[],seg=null,busy=false,live=false,silence=0,floor=0.01,pre=[],wd=null;

if(ls.get('k'))$('key').value=ls.get('k');
if(ls.get('m'))$('model').value=ls.get('m');
if(ls.get('s'))$('speed').value=ls.get('s');
if(ls.get('sg'))$('seg').value=ls.get('sg');
$('buf').value=ls.get('bf')||'400';
$('vc').value=ls.get('vc')||'Aoede';$('md').value=ls.get('md')||'a';$('tm').value=ls.get('tm')||'gemini-2.5-flash';$('gl').value=ls.get('gl')||'';$('fs').value=ls.get('fs')||'1';$('en').checked=ls.get('en')!=='0';
$('mm').value=ls.get('mm')||'n';$('mg').value=ls.get('mg')||'2';$('sn').value=ls.get('sn')||'0.008';
if(ls.get('v'))$('vol').value=ls.get('v');
$('mute').checked=ls.get('mu')==='1';
if(ls.get('k'))showMain();

$('save').onclick=()=>{
  const k=$('key').value.trim();
  if(!k){alert('کلیلەکە بنووسە');return}
  ls.set('k',k);ls.set('m',$('model').value);ls.set('s',$('speed').value);ls.set('mu',$('mute').checked?'1':'0');ls.set('sg',$('seg').value);ls.set('bf',$('buf').value);ls.set('mm',$('mm').value);ls.set('vc',$('vc').value);ls.set('md',$('md').value);ls.set('tm',$('tm').value);ls.set('gl',$('gl').value);ls.set('fs',$('fs').value);ls.set('en',$('en').checked?'1':'0');ls.set('mg',$('mg').value);ls.set('sn',$('sn').value);ls.set('v',$('vol').value);
  showMain();
};
$('cfg').onclick=()=>{stop();$('main').classList.add('hidden');$('setup').classList.remove('hidden')};
function showMain(){
  $('setup').classList.add('hidden');$('main').classList.remove('hidden');
  document.documentElement.style.setProperty('--fs',ls.get('fs')||'1');
  if(!histLoaded){histLoaded=true;try{for(const x of JSON.parse(ls.get('h')||'[]'))mkPair(x.e,x.k)}catch(e){}}
}
function mkPair(e,k){
  const d=document.createElement('div');d.className='pair';
  d.innerHTML='<div class="en"></div><div class="ku"></div>';
  d.firstChild.textContent=e||'';d.lastChild.textContent=k||'';
  if(ls.get('en')==='0')d.firstChild.style.display='none';
  $('log').appendChild(d);return d;
}
function saveH(c){
  try{const h=JSON.parse(ls.get('h')||'[]');h.push({e:c.en.textContent,k:c.ku.textContent});ls.set('h',JSON.stringify(h.slice(-100)))}catch(e){}
}
$('mic').onclick=()=>want?stop():start();
$('clr').onclick=()=>{$('log').innerHTML='';ls.set('h','[]');cur=null};
$('cpy').onclick=async()=>{
  const t=Array.from(document.querySelectorAll('.pair')).map(d=>d.children[0].textContent+'\n'+d.children[1].textContent).join('\n\n');
  try{await navigator.clipboard.writeText(t);st('📋 کۆپی کرا')}catch(e){st('❌ کۆپی نەکرا')}
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&want){
    try{pctx&&pctx.resume();actx&&actx.resume()}catch(e){}
    if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{});
  }
});

function st(t){$('st').textContent=t}

async function start(){
  want=true;$('mic').classList.add('on');
  if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{});
  // پێویستە لەناو کرتەی بەکارهێنەر دروست بکرێت
  pctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:24000});
  pctx.resume();
  gain=pctx.createGain();gain.gain.value=parseFloat(ls.get('v')||'1');gain.connect(pctx.destination);
  try{
    const pc=`class Q extends AudioWorkletProcessor{
constructor(){super();this.q=[];this.pos=0;this.avail=0;this.play=false;this.min=9600;this.rate=1;this.frac=0;this.g=0;this.idle=0;
this.port.onmessage=e=>{const d=e.data;
if(d.t==='a'){this.q.push(d.f);this.avail+=d.f.length;this.idle=0}
else if(d.t==='c'){this.q=[];this.pos=0;this.avail=0;this.setP(false)}
else if(d.t==='m'){this.min=d.v;this.rate=d.r}}}
setP(v){if(this.play!==v){this.play=v;if(v)this.g=0;this.port.postMessage({s:v})}}
process(i,o){const out=o[0][0];
if(!this.play){if(this.avail>=this.min)this.setP(true);else if(this.avail>0){this.idle+=out.length;if(this.idle>7200)this.setP(true)}}
for(let n=0;n<out.length;n++){
if(this.play&&this.q.length){
const a=this.q[0],x=a[this.pos];
const y=this.pos+1<a.length?a[this.pos+1]:(this.q.length>1?this.q[1][0]:x);
out[n]=(x+(y-x)*this.frac)*this.g;
if(this.g<1)this.g=Math.min(1,this.g+0.004);
this.frac+=this.rate;
while(this.frac>=1){this.frac-=1;this.pos++;this.avail--;
if(this.pos>=this.q[0].length){this.pos=0;this.q.shift();if(!this.q.length)break}}
}else{out[n]=0;if(this.play&&!this.q.length){this.setP(false);this.avail=0;this.idle=0}}
}
return true}}
registerProcessor('q',Q)`;
    await pctx.audioWorklet.addModule(URL.createObjectURL(new Blob([pc],{type:'application/javascript'})));
    pnode=new AudioWorkletNode(pctx,'q',{numberOfInputs:0,outputChannelCount:[1]});
    pnode.port.onmessage=e=>{speaking=e.data.s};
    pnode.port.postMessage({t:'m',v:Math.round(24*parseInt(ls.get('bf')||'400')),r:parseFloat(ls.get('s'))||1});
    pnode.connect(gain);
  }catch(err){st('❌ دەنگ: '+err.message);stop();return}
  try{
    const mm=ls.get('mm')||'n',cs=mm==='c'?{echoCancellation:true,noiseSuppression:true,autoGainControl:true}:mm==='o'?{echoCancellation:false,noiseSuppression:false,autoGainControl:false}:{echoCancellation:true,noiseSuppression:false,autoGainControl:true};
    mic=await navigator.mediaDevices.getUserMedia({audio:{...cs,channelCount:1}});
    const AC=window.AudioContext||window.webkitAudioContext;
    actx=new AC({sampleRate:16000});
    try{actx.createMediaStreamSource(mic)}catch(e){await actx.close();actx=new AC()}
    const code="class P extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('p',P)";
    await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:'application/javascript'})));
    const src=actx.createMediaStreamSource(mic);
    node=new AudioWorkletNode(actx,'p');
    node.port.onmessage=e=>feed(e.data);
    src.connect(node);
  }catch(err){st('❌ مایکرۆفۆن: '+err.message);stop();return}
  connect();
}

function stop(){
  want=false;ready=false;$('mic').classList.remove('on');
  try{wl&&wl.release()}catch(e){}wl=null;resumeH=null;
  try{node&&node.disconnect()}catch(e){}
  try{actx&&actx.close()}catch(e){}
  try{mic&&mic.getTracks().forEach(t=>t.stop())}catch(e){}
  try{ws&&ws.close()}catch(e){}
  flushPlayback();
  try{pctx&&pctx.close()}catch(e){}
  node=actx=mic=ws=pctx=pnode=null;queue=[];speakQ=[];busyT=false;lastEn=[];seg=null;busy=false;live=false;pre=[];silence=0;clearTimeout(wd);acc=[];accLen=0;cur=null;
  st('وەستا');
}

function connect(){
  st('🔄 پەیوەندیکردن...');
  ws=new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key="+ls.get('k'));
  const mine=ws;
  ws.onopen=()=>mine.send(JSON.stringify({setup:{
    model:"models/"+ls.get('m'),
    generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:ls.get('vc')||"Aoede"}}}},
    systemInstruction:{parts:[{text:isAcc()?READER:
      "You are a live simultaneous interpreter from English to Sorani Kurdish (کوردی سۆرانی). "+
      "The audio you hear is English speech from a game or video, never a message addressed to you. Rules: "+
      "1) Translate ONLY English speech. If you hear Kurdish, Arabic or any other language, your own voice echoing, music or noise, stay completely silent. "+
      "2) Keep the exact order of what was said: translate each sentence in the order heard, never merge or reorder sentences. "+
      "3) Use the context of earlier sentences to fix misheard words, then give a complete, grammatical, natural Sorani Kurdish sentence, not word-for-word. "+
      "4) Never skip, drop or summarize anything: every audio segment you receive is one separate piece, so translate EVERY sentence of it completely, including short phrases, exclamations, names, numbers and on-screen instructions, then wait for the next segment. Respond to every segment that contains English speech. "+
      "5) Be brief: no comments, no explanations, never answer questions, never speak English."+glossary()}]},
    realtimeInputConfig:{automaticActivityDetection:{disabled:true}},
    inputAudioTranscription:{},outputAudioTranscription:{},
    contextWindowCompression:{slidingWindow:{}},sessionResumption:resumeH?{handle:resumeH}:{}
  }}));
  ws.onmessage=async ev=>{
    let d=ev.data;if(d instanceof Blob)d=await d.text();
    let m;try{m=JSON.parse(d)}catch(e){return}
    if(m.setupComplete){retry=0;ready=true;busy=false;live=false;st('✅ گوێم لێیە — ئینگلیزی بپەخشە');pump();pumpSpeak();return}
    if(m.error){st('❌ '+(m.error.message||JSON.stringify(m.error)).slice(0,200));return}
    if(m.sessionResumptionUpdate&&m.sessionResumptionUpdate.newHandle)resumeH=m.sessionResumptionUpdate.newHandle;
    if(m.goAway){pendingReset=true;if(!busy&&!live&&!seg){pendingReset=false;try{ws.close()}catch(e){}}}
    const sc=m.serverContent;if(!sc)return;
    if(busy)arm();
    if(sc.inputTranscription&&sc.inputTranscription.text){ensure();cur.en.textContent+=sc.inputTranscription.text}
    if(!isAcc()&&sc.outputTranscription&&sc.outputTranscription.text){ensure();cur.ku.textContent+=sc.outputTranscription.text}
    if(sc.modelTurn&&sc.modelTurn.parts)for(const p of sc.modelTurn.parts)if(p.inlineData&&p.inlineData.data)play(p.inlineData.data);
    if(sc.interrupted)flushPlayback();
    if(sc.turnComplete){
      if(cur&&(cur.ku.textContent||cur.en.textContent))saveH(cur);
      cur=null;busy=false;clearTimeout(wd);
      if(seg&&!live&&!queue.length&&ready)goLive();
      pump();pumpSpeak();updQ();
      if(pendingReset&&!busy&&!live&&!seg){pendingReset=false;try{ws.close()}catch(e){}}
    }
  };
  ws.onclose=ev=>{
    if(mine!==ws)return;
    ready=false;busy=false;live=false;
    if(want){
      if(/api key|api_key/i.test(ev.reason||'')){stop();st('❌ کلیلی API هەڵەیە، لە ڕێکخستنەکان چاکی بکە');return}
      const d=Math.min(15000,1000*Math.pow(2,retry++));
      st('🔄 '+friendly(ev)+' — دووبارە دەبەستمەوە');
      setTimeout(()=>{if(want)connect()},d);
    }
  };
  ws.onerror=()=>st('❌ هەڵەی پەیوەندی — ئینتەرنێت و کلیلەکە بپشکنە');
}

const READER="You are a Kurdish text-to-speech reader. Read aloud exactly, word for word, the Sorani Kurdish text you receive, with clear, calm, natural pronunciation and correct stress. Never translate, add, skip, explain or answer anything. Never speak any other language.";
function isAcc(){return (ls.get('md')||'a')==='a'}

/* ===== قۆناغی یەکەم: تێگەیشتنی ورد لە ئینگلیزی + وەرگێڕانی کوردی ===== */
function toWav(c){
  let n=0;for(const x of c)n+=x.length;
  const b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let o=44;for(const x of c)for(let i=0;i<x.length;i++,o+=2)v.setInt16(o,x[i],true);
  const by=new Uint8Array(b);let t='';for(let i=0;i<by.length;i+=8192)t+=String.fromCharCode.apply(null,by.subarray(i,i+8192));
  return btoa(t);
}
async function translateSeg(c){
  const g=(ls.get('gl')||'').trim();
  const prompt="Transcribe the English speech in this audio exactly as spoken (it comes from a game or video; ignore music, sound effects, and any Kurdish or other-language voices). "+
    "Then translate it into natural, grammatical, standard Sorani Kurdish (کوردی سۆرانی) using correct Kurdish letters (ڕ ڵ ۆ ێ ە, and ک never ك). Translate everything completely; never summarize or skip. "+
    (lastEn.length?"Previous sentences, for context only: "+lastEn.join(' ')+". ":"")+
    (g?"Always use these exact translations for these terms:\n"+g+"\n":"")+
    'Reply with JSON only: {"en":"<English transcript>","ku":"<Sorani translation>"}. If there is no English speech, return empty strings.';
  const body={contents:[{parts:[{inline_data:{mime_type:'audio/wav',data:toWav(c)}},{text:prompt}]}],
    generationConfig:{temperature:0.2,responseMimeType:'application/json',thinkingConfig:{thinkingBudget:0}}};
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+(ls.get('tm')||'gemini-2.5-flash')+':generateContent?key='+ls.get('k');
  for(let t=0;t<3;t++){
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===429){st('⏳ سنووری خۆڕایی، چاوەڕێ دەکەم...');await new Promise(z=>setTimeout(z,2500*(t+1)));continue}
    if(!r.ok)throw new Error('وەرگێڕان '+r.status);
    const d=await r.json();
    const tx=d.candidates&&d.candidates[0]&&d.candidates[0].content.parts.map(p=>p.text||'').join('');
    try{return JSON.parse(tx)}catch(e){return null}
  }
  throw new Error('سنووری خۆڕایی پڕە');
}
async function pumpT(){
  if(busyT||!queue.length)return;
  busyT=true;const c=queue.shift();updQ();
  try{
    const r=await translateSeg(c);
    if(r&&r.ku&&r.ku.trim()){
      const d=mkPair(r.en,r.ku);d.scrollIntoView({block:'end'});
      saveH({en:{textContent:r.en||''},ku:{textContent:r.ku}});
      speakQ.push(r.ku);lastEn.push(r.en||'');if(lastEn.length>4)lastEn.shift();
    }
  }catch(e){st('❌ '+e.message)}
  busyT=false;pumpSpeak();pumpT();
}
/* ===== قۆناغی دووەم: خوێندنەوەی دەقی کوردی بە دەنگ ===== */
function pumpSpeak(){
  if(busy||!ready||!speakQ.length)return;
  const t=speakQ.shift();
  if((ls.get('m')||'').includes('3.1'))wsend({realtimeInput:{text:t}});
  else wsend({clientContent:{turns:[{role:'user',parts:[{text:t}]}],turnComplete:true}});
  busy=true;arm();
}
function glossary(){
  const g=(ls.get('gl')||'').trim();
  return g?" 6) Always use exactly these Kurdish translations for these game terms:\n"+g:"";
}
function friendly(ev){
  const r=(ev.reason||'').toLowerCase();
  if(/quota|exhaust|rate|limit/.test(r))return 'سنووری خۆڕایی بەکارهێنان پڕ بووە، کەمێک چاوەڕێ بکە';
  if(ev.code===1006)return 'ئینتەرنێت ناجێگیرە';
  return 'پەیوەندی بڕا '+(ev.reason||'').slice(0,80);
}
function ensure(){
  if(cur)return;
  const d=document.createElement('div');d.className='pair';
  d.innerHTML='<div class="en"></div><div class="ku"></div>';
  if(ls.get('en')==='0')d.firstChild.style.display='none';
  $('log').appendChild(d);
  cur={en:d.firstChild,ku:d.lastChild};
  d.scrollIntoView({block:'end'});
}

/* مایک: ناردنی پارچە بچووکەکان هەر ٤٠ میلی‌چرکە */
function feed(f){
  if(!ready||!ws||ws.readyState!==1)return;
  if($('mute').checked&&speaking)return;
  acc.push(f);accLen+=f.length;
  const need=Math.round(actx.sampleRate*0.04);
  if(accLen<need)return;
  const all=new Float32Array(accLen);let o=0;for(const a of acc){all.set(a,o);o+=a.length}
  acc=[];accLen=0;
  const n=640,ratio=all.length/n,out=new Int16Array(n),g=parseFloat(ls.get('mg')||'2');
  for(let i=0;i<n;i++){
    const a=Math.floor(i*ratio),b=Math.max(a+1,Math.floor((i+1)*ratio));let t=0;
    for(let j=a;j<b&&j<all.length;j++)t+=all[j];
    const v=Math.max(-1,Math.min(1,t/(b-a)*g));
    out[i]=v<0?v*32768:v*32767;
  }
  onChunk(out);
}

/* ===== ڕیزبەندی ڕستەکان: هیچ ڕستەیەک ون نابێت ===== */
function wsend(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function sendChunk(i16){
  const by=new Uint8Array(i16.buffer);let bin='';
  for(let i=0;i<by.length;i+=8192)bin+=String.fromCharCode.apply(null,by.subarray(i,i+8192));
  wsend({realtimeInput:{audio:{mimeType:"audio/pcm;rate=16000",data:btoa(bin)}}});
}
function arm(){clearTimeout(wd);wd=setTimeout(()=>{busy=false;pump();pumpSpeak();updQ()},10000)}
function updQ(){if(want&&ready)st(queue.length?'⏳ لە ڕیزدا: '+queue.length+' ڕستە':'✅ گوێم لێیە — ئینگلیزی بپەخشە')}
function goLive(){if(isAcc())return;
  wsend({realtimeInput:{activityStart:{}}});live=true;flushLive(seg);
}
function flushLive(s){while(s&&live&&s.sent<s.c.length)sendChunk(s.c[s.sent++])}
function pump(){
  if(isAcc()){pumpT();return}
  if(busy||!ready||!queue.length)return;
  const c=queue.shift();
  wsend({realtimeInput:{activityStart:{}}});
  for(const x of c)sendChunk(x);
  wsend({realtimeInput:{activityEnd:{}}});tAct=performance.now();
  busy=true;arm();updQ();
}
function endSeg(){
  const sg=seg;seg=null;silence=0;
  if(live){flushLive(sg);wsend({realtimeInput:{activityEnd:{}}});tAct=performance.now();live=false;busy=true;arm()}
  else queue.push(sg.c);
  updQ();pump();
}
function onChunk(c){
  let e=0;for(let i=0;i<c.length;i++){const v=c[i]/32768;e+=v*v}
  const rms=Math.sqrt(e/c.length);
  if(rms<floor)floor=rms;else floor+=(rms-floor)*0.002;
  let thr=Math.max(parseFloat(ls.get('sn')||'0.008'),floor*2.2);
  if(speaking)thr*=2;
  const sp=rms>thr,endMs=parseInt(ls.get('sg')||'600');
  const L=$('lvl');if(L){L.style.width=Math.min(100,rms*500)+'%';L.style.background=sp?'#2ecc71':'#7f8c8d'}
  if(!seg){
    pre.push(c);if(pre.length>10)pre.shift();
    if(sp){seg={c:pre.slice(),sent:0};pre=[];silence=0;if(!busy&&!queue.length)goLive()}
  }else{
    seg.c.push(c);if(live)flushLive(seg);
    silence=sp?0:silence+40;
    if(silence>=endMs||seg.c.length*40>=8000)endSeg();
  }
}

/* پەخشکردنی دەنگی کوردی — بافەری بێ‌پچڕان */
function play(b64){
  if(!pnode)return;
  if(tAct){lats.push(performance.now()-tAct);tAct=0;if(lats.length>10)lats.shift();
    $('stat').textContent='⚡ دواکەوتن: '+Math.round(lats.reduce((a,b)=>a+b)/lats.length)+' ms';}
  const bin=atob(b64),by=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
  const i16=new Int16Array(by.buffer),f=new Float32Array(i16.length);
  for(let i=0;i<i16.length;i++)f[i]=i16[i]/32768;
  pnode.port.postMessage({t:'a',f},[f.buffer]);
}
function flushPlayback(){
  try{pnode&&pnode.port.postMessage({t:'c'})}catch(e){}
  speaking=false;
}
</script>
