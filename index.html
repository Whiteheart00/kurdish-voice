<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وەرگێڕی دەنگی کوردی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:1.4rem;margin:8px 0 2px}
.sub{color:#8fd3f4;font-size:.85rem;margin-bottom:12px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px;width:100%;max-width:480px;margin-bottom:12px}
label{font-size:.8rem;color:#a8d8ea;display:block;margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #4a7c9b;background:rgba(0,0,0,.35);color:#fff;font-size:.95rem;direction:ltr;font-family:inherit}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#1a7f5a;color:#fff;font-size:1rem;margin-top:10px;font-weight:bold}
.btn:disabled{background:#555}
.row{display:flex;gap:8px;align-items:center;font-size:.85rem;margin-top:10px}
.row input{width:auto}
#main{width:100%;display:flex;flex-direction:column;align-items:center}
#mic{width:130px;height:130px;border-radius:50%;border:none;font-size:2.8rem;background:radial-gradient(circle at 30% 30%,#ff6b6b,#c0392b);box-shadow:0 8px 24px rgba(192,57,43,.5);margin:12px 0 6px;color:#fff}
#mic.on{background:radial-gradient(circle at 30% 30%,#2ecc71,#1a7f5a);box-shadow:0 8px 24px rgba(46,204,113,.5);animation:p 1.6s infinite}
@keyframes p{50%{transform:scale(1.06)}}
#mic:disabled{opacity:.5}
#st{font-size:.9rem;color:#ffd166;min-height:22px;text-align:center;max-width:480px;word-break:break-word}
#gameTag{font-size:.75rem;color:#8fd3f4;text-align:center;max-width:480px;margin-top:2px;direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log{width:100%;max-width:480px;max-height:42vh;overflow-y:auto;margin-top:8px}
.pair{background:rgba(26,127,90,.3);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.en{direction:ltr;text-align:left;font-size:.75rem;color:#9fb8c4;margin-bottom:3px}
.ku{font-size:1.05rem;line-height:1.7}
.bar{display:flex;gap:8px;width:100%;max-width:480px;margin-top:10px}
.bar button{flex:1;padding:9px;border:none;border-radius:10px;background:#34495e;color:#fff;font-size:.85rem}
.hint{font-size:.75rem;color:#8aa5b3;text-align:center;max-width:480px;margin-top:6px;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>🎙️ وەرگێڕی دەنگی کوردی</h1>
<div class="sub">ئینگلیزی دەبیسترێت، یەکسەر بە کوردی دەگوترێتەوە</div>

<div class="card" id="setup">
  <label>کلیلی Gemini (خۆڕایە لە aistudio.google.com)</label>
  <input type="password" id="key" placeholder="API Key" autocomplete="off">
  <label>مۆدێل</label>
  <select id="model">
    <option>gemini-2.5-flash-native-audio-preview-12-2025</option>
    <option>gemini-3.1-flash-live-preview</option>
    <option>gemini-2.5-flash-native-audio-preview-09-2025</option>
  </select>

  <label>🎮 یاری / ناوەڕۆکی دەنگەکان (بۆ وەرگێڕانی باشتر)</label>
  <input type="text" id="gname" placeholder="Game name, e.g. The Last of Us Part II">
  <label>کارەکتەرەکان، شوێنەکان، جۆری چیرۆک (ئارەزوومەندانە)</label>
  <textarea id="gctx" placeholder="Characters: Ellie, Joel, Dina... &#10;Story: post-apocalyptic survival drama, serious tone... &#10;Special terms: Clickers, WLF, Seraphites..."></textarea>

  <label>شێوازی پەخشکردنی دەنگی کوردی</label>
  <select id="pm">
    <option value="chunk">پارچە-پارچە — هەر ڕستەیەک تەواو بوو پەخش دەکرێت (بێ پچڕان، پێشنیارکراو)</option>
    <option value="live">زیندوو — هەر کە دەنگ هات پەخش دەکرێت (خێراتر)</option>
  </select>
  <label>خێرایی دەنگی کوردی</label>
  <select id="speed"><option value="1">ئاسایی</option><option value="1.15">خێرا</option><option value="1.3">زۆر خێرا</option></select>
  <label>جێگیری دەنگی کوردی (تەنها لە شێوازی زیندوو)</label>
  <select id="buf"><option value="200">کەم — خێراترین</option><option value="400">ناوەند — پێشنیارکراو</option><option value="700">زۆر — بێ پچڕانترین</option></select>
  <label>بڕینی ڕستەکان (ڕێکخستنی ڕستە)</label>
  <select id="seg"><option value="250">زۆر خێرا — ڕستەی کورت</option><option value="600">ڕێکخراو — پێشنیارکراو</option><option value="1000">وردتر — دواکەوتنی زیاتر</option></select>
  <label>بەرزی دەنگی کوردی</label>
  <input type="range" id="vol" min="0.2" max="1" step="0.1" value="1">
  <div class="row"><input type="checkbox" id="mute"><span>مایک بکوژێنەوە کاتێک کوردی دەگوترێت (ئەگەر هێدفۆن نییە)</span></div>
  <button class="btn" id="save">پاشەکەوتکردن</button>
</div>

<div id="main" class="hidden">
  <div id="st">ئامادەیە</div>
  <div id="gameTag"></div>
  <button id="mic">🎤</button>
  <div class="hint">یەکجار دایبگرە بۆ دەستپێکردن، دووبارە دایبگرە بۆ وەستاندن. بۆ باشترین ئەنجام هێدفۆن بەکاربهێنە.</div>
  <div class="bar"><button id="clr">🗑️ پاککردنەوە</button></div>
  <div id="log"></div>
  <button class="btn" id="cfg" style="max-width:200px;background:#34495e">ڕێکخستنەکان</button>
</div>

<script>
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let ws=null,ready=false,want=false,mic=null,actx=null,node=null,acc=[],accLen=0;
let gain=null,pctx=null,pnode=null,cur=null,speaking=false;
let queue=[],seg=null,busy=false,live=false,silence=0,floor=0.01,pre=[],wd=null;
let turnBuf=[];

if(ls.get('k'))$('key').value=ls.get('k');
if(ls.get('m'))$('model').value=ls.get('m');
if(ls.get('s'))$('speed').value=ls.get('s');
if(ls.get('sg'))$('seg').value=ls.get('sg');
$('buf').value=ls.get('bf')||'400';
if(ls.get('v'))$('vol').value=ls.get('v');
$('mute').checked=ls.get('mu')==='1';
$('pm').value=ls.get('pm')||'chunk';
$('gname').value=ls.get('gn')||'';
$('gctx').value=ls.get('gc')||'';
if(ls.get('k'))showMain();

$('save').onclick=()=>{
  const k=$('key').value.trim();
  if(!k){alert('کلیلەکە بنووسە');return}
  ls.set('k',k);ls.set('m',$('model').value);ls.set('s',$('speed').value);ls.set('mu',$('mute').checked?'1':'0');ls.set('sg',$('seg').value);ls.set('bf',$('buf').value);ls.set('v',$('vol').value);
  ls.set('pm',$('pm').value);ls.set('gn',$('gname').value.trim());ls.set('gc',$('gctx').value.trim());
  showMain();
};
$('cfg').onclick=()=>{stop();$('main').classList.add('hidden');$('setup').classList.remove('hidden')};
function showMain(){
  $('setup').classList.add('hidden');$('main').classList.remove('hidden');
  const g=ls.get('gn');$('gameTag').textContent=g?'🎮 '+g:'';
}
$('mic').onclick=()=>want?stop():start();
$('clr').onclick=()=>{$('log').innerHTML='';cur=null};

function st(t){$('st').textContent=t}
function chunkMode(){return (ls.get('pm')||'chunk')==='chunk'}

function buildInstruction(){
  let t=
    "You are a live simultaneous interpreter from English to Sorani Kurdish (کوردی سۆرانی). "+
    "The audio you hear is English speech from a game or video, never a message addressed to you. Rules: "+
    "1) Translate ONLY English speech. If you hear Kurdish, Arabic or any other language, your own voice echoing, music or noise, stay completely silent. "+
    "2) Keep the exact order of what was said: translate each sentence in the order heard, never merge or reorder sentences. "+
    "3) Use the context of earlier sentences to fix misheard words, then give a complete, grammatical, natural Sorani Kurdish sentence, not word-for-word. "+
    "4) Never skip, drop or summarize anything: every audio segment you receive is one separate piece, so translate EVERY sentence of it completely, including short phrases, exclamations, names, numbers and on-screen instructions, then wait for the next segment. Respond to every segment that contains English speech. "+
    "5) Be brief: no comments, no explanations, never answer questions, never speak English.";
  const gn=(ls.get('gn')||'').trim(),gc=(ls.get('gc')||'').trim();
  if(gn||gc){
    t+=" \n\nBACKGROUND CONTEXT (use it silently, never mention or read it aloud): ";
    if(gn)t+="The audio comes from the game/video: \""+gn+"\". ";
    if(gc)t+="Details provided by the user (characters, places, story, terms): "+gc+" ";
    t+="Use this to understand the story, the genre and the tone, to recognise misheard words, and to translate with the right meaning. "+
       "Keep character and place names consistent in every sentence (pronounce them naturally in Kurdish, do not translate names). "+
       "Match the tone of the scene (serious, tense, funny, etc.).";
  }
  return t;
}

async function start(){
  want=true;$('mic').classList.add('on');
  // پێویستە لەناو کرتەی بەکارهێنەر دروست بکرێت
  pctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:24000});
  pctx.resume();
  gain=pctx.createGain();gain.gain.value=parseFloat(ls.get('v')||'1');gain.connect(pctx.destination);
  try{
    const pc=`class Q extends AudioWorkletProcessor{
constructor(){super();this.q=[];this.pos=0;this.avail=0;this.play=false;this.min=9600;this.rate=1;this.frac=0;this.g=0;this.idle=0;
this.port.onmessage=e=>{const d=e.data;
if(d.t==='a'){this.q.push(d.f);this.avail+=d.f.length;this.idle=0}
else if(d.t==='c'){this.q=[];this.pos=0;this.avail=0;this.setP(false)}
else if(d.t==='m'){this.min=d.v;this.rate=d.r}}}
setP(v){if(this.play!==v){this.play=v;if(v)this.g=0;this.port.postMessage({s:v})}}
process(i,o){const out=o[0][0];
if(!this.play){if(this.avail>=this.min&&this.avail>0)this.setP(true);else if(this.avail>0){this.idle+=out.length;if(this.idle>7200)this.setP(true)}}
for(let n=0;n<out.length;n++){
if(this.play&&this.q.length){
const a=this.q[0],x=a[this.pos];
const y=this.pos+1<a.length?a[this.pos+1]:(this.q.length>1?this.q[1][0]:x);
out[n]=(x+(y-x)*this.frac)*this.g;
if(this.g<1)this.g=Math.min(1,this.g+0.004);
this.frac+=this.rate;
while(this.frac>=1){this.frac-=1;this.pos++;this.avail--;
if(this.pos>=this.q[0].length){this.pos=0;this.q.shift();if(!this.q.length)break}}
}else{out[n]=0;if(this.play&&!this.q.length){this.setP(false);this.avail=0;this.idle=0}}
}
return true}}
registerProcessor('q',Q)`;
    await pctx.audioWorklet.addModule(URL.createObjectURL(new Blob([pc],{type:'application/javascript'})));
    pnode=new AudioWorkletNode(pctx,'q',{numberOfInputs:0,outputChannelCount:[1]});
    pnode.port.onmessage=e=>{speaking=e.data.s};
    // لە شێوازی پارچە-پارچە ڕستەکە تەواو دێت، بۆیە یەکسەر پەخش دەکرێت
    const minSamples=chunkMode()?1:Math.round(24*parseInt(ls.get('bf')||'400'));
    pnode.port.postMessage({t:'m',v:minSamples,r:parseFloat(ls.get('s'))||1});
    pnode.connect(gain);
  }catch(err){st('❌ دەنگ: '+err.message);stop();return}
  try{
    mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const code="class P extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('p',P)";
    await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:'application/javascript'})));
    const src=actx.createMediaStreamSource(mic);
    node=new AudioWorkletNode(actx,'p');
    node.port.onmessage=e=>feed(e.data);
    src.connect(node);
  }catch(err){st('❌ مایکرۆفۆن: '+err.message);stop();return}
  connect();
}

function stop(){
  want=false;ready=false;$('mic').classList.remove('on');
  try{node&&node.disconnect()}catch(e){}
  try{actx&&actx.close()}catch(e){}
  try{mic&&mic.getTracks().forEach(t=>t.stop())}catch(e){}
  try{ws&&ws.close()}catch(e){}
  flushPlayback();
  try{pctx&&pctx.close()}catch(e){}
  node=actx=mic=ws=pctx=pnode=null;queue=[];seg=null;busy=false;live=false;pre=[];silence=0;clearTimeout(wd);acc=[];accLen=0;cur=null;turnBuf=[];
  st('وەستا');
}

function connect(){
  st('🔄 پەیوەندیکردن...');
  ws=new WebSocket("wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key="+ls.get('k'));
  const mine=ws;
  ws.onopen=()=>mine.send(JSON.stringify({setup:{
    model:"models/"+ls.get('m'),
    generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Aoede"}}}},
    systemInstruction:{parts:[{text:buildInstruction()}]},
    realtimeInputConfig:{automaticActivityDetection:{disabled:true}},
    inputAudioTranscription:{},outputAudioTranscription:{},
    contextWindowCompression:{slidingWindow:{}}
  }}));
  ws.onmessage=async ev=>{
    let d=ev.data;if(d instanceof Blob)d=await d.text();
    let m;try{m=JSON.parse(d)}catch(e){return}
    if(m.setupComplete){ready=true;busy=false;live=false;st('✅ گوێم لێیە — ئینگلیزی بپەخشە');pump();return}
    if(m.error){st('❌ '+(m.error.message||JSON.stringify(m.error)).slice(0,200));return}
    const sc=m.serverContent;if(!sc)return;
    if(busy)arm();
    if(sc.inputTranscription&&sc.inputTranscription.text){ensure();cur.en.textContent+=sc.inputTranscription.text}
    if(sc.outputTranscription&&sc.outputTranscription.text){ensure();cur.ku.textContent+=sc.outputTranscription.text}
    if(sc.modelTurn&&sc.modelTurn.parts)for(const p of sc.modelTurn.parts)if(p.inlineData&&p.inlineData.data)play(p.inlineData.data);
    if(sc.interrupted){turnBuf=[];flushPlayback()}
    if(sc.turnComplete){flushTurn();cur=null;busy=false;clearTimeout(wd);if(seg&&!live&&!queue.length&&ready)goLive();pump();updQ()}
  };
  ws.onclose=ev=>{
    if(mine!==ws)return;
    ready=false;busy=false;live=false;turnBuf=[];
    if(want){st('🔄 پەیوەندی بڕا، دووبارە دەبەستمەوە... '+(ev.reason||'').slice(0,120));setTimeout(()=>{if(want)connect()},1000)}
  };
  ws.onerror=()=>st('❌ هەڵەی پەیوەندی — ئینتەرنێت و کلیلەکە بپشکنە');
}

function ensure(){
  if(cur)return;
  const d=document.createElement('div');d.className='pair';
  d.innerHTML='<div class="en"></div><div class="ku"></div>';
  $('log').appendChild(d);
  cur={en:d.firstChild,ku:d.lastChild};
  d.scrollIntoView({block:'end'});
}

/* مایک: ناردنی پارچە بچووکەکان هەر ٤٠ میلی‌چرکە */
function feed(f){
  if(!ready||!ws||ws.readyState!==1)return;
  if($('mute').checked&&speaking)return;
  acc.push(f);accLen+=f.length;
  const need=Math.round(actx.sampleRate*0.04);
  if(accLen<need)return;
  const all=new Float32Array(accLen);let o=0;for(const a of acc){all.set(a,o);o+=a.length}
  acc=[];accLen=0;
  const n=640,ratio=all.length/n,out=new Int16Array(n);
  for(let i=0;i<n;i++){
    const p=i*ratio,j=Math.floor(p),fr=p-j,a=all[j],b=all[Math.min(j+1,all.length-1)];
    const s=Math.max(-1,Math.min(1,a+(b-a)*fr));
    out[i]=s<0?s*32768:s*32767;
  }
  onChunk(out);
}

/* ===== ڕیزبەندی ڕستەکان: هیچ ڕستەیەک ون نابێت ===== */
function wsend(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function sendChunk(i16){
  const by=new Uint8Array(i16.buffer);let bin='';
  for(let i=0;i<by.length;i+=8192)bin+=String.fromCharCode.apply(null,by.subarray(i,i+8192));
  wsend({realtimeInput:{audio:{mimeType:"audio/pcm;rate=16000",data:btoa(bin)}}});
}
function arm(){clearTimeout(wd);wd=setTimeout(()=>{flushTurn();busy=false;pump();updQ()},10000)}
function updQ(){if(want&&ready)st(queue.length?'⏳ لە ڕیزدا: '+queue.length+' ڕستە':'✅ گوێم لێیە — ئینگلیزی بپەخشە')}
function goLive(){
  wsend({realtimeInput:{activityStart:{}}});live=true;flushLive(seg);
}
function flushLive(s){while(s&&live&&s.sent<s.c.length)sendChunk(s.c[s.sent++])}
function pump(){
  if(busy||!ready||!queue.length)return;
  const c=queue.shift();
  wsend({realtimeInput:{activityStart:{}}});
  for(const x of c)sendChunk(x);
  wsend({realtimeInput:{activityEnd:{}}});
  busy=true;arm();updQ();
}
function endSeg(){
  const sg=seg;seg=null;silence=0;
  if(live){flushLive(sg);wsend({realtimeInput:{activityEnd:{}}});live=false;busy=true;arm()}
  else queue.push(sg.c);
  updQ();pump();
}
function onChunk(c){
  let e=0;for(let i=0;i<c.length;i++){const v=c[i]/32768;e+=v*v}
  const rms=Math.sqrt(e/c.length);
  if(rms<floor)floor=rms;else floor+=(rms-floor)*0.002;
  let thr=Math.max(0.012,floor*2.5);
  if(speaking)thr*=2;
  const sp=rms>thr,endMs=parseInt(ls.get('sg')||'600');
  if(!seg){
    pre.push(c);if(pre.length>5)pre.shift();
    if(sp){seg={c:pre.slice(),sent:0};pre=[];silence=0;if(!busy&&!queue.length)goLive()}
  }else{
    seg.c.push(c);if(live)flushLive(seg);
    silence=sp?0:silence+40;
    if(silence>=endMs||seg.c.length*40>=8000)endSeg();
  }
}

/* پەخشکردنی دەنگی کوردی */
function decode(b64){
  const bin=atob(b64),by=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
  const i16=new Int16Array(by.buffer),f=new Float32Array(i16.length);
  for(let i=0;i<i16.length;i++)f[i]=i16[i]/32768;
  return f;
}
function play(b64){
  if(!pnode)return;
  const f=decode(b64);
  if(chunkMode()){turnBuf.push(f);return}   // پارچەکان کۆدەکرێنەوە تا ڕستەکە تەواو دەبێت
  pnode.port.postMessage({t:'a',f},[f.buffer]);
}
/* شێوازی پارچە-پارچە: هەموو دەنگی ڕستەیەک وەک یەک پارچە دەنێردرێت و دوای ئەوی پێشوو پەخش دەکرێت */
function flushTurn(){
  if(!turnBuf.length||!pnode){turnBuf=[];return}
  let len=0;for(const a of turnBuf)len+=a.length;
  const all=new Float32Array(len);let o=0;for(const a of turnBuf){all.set(a,o);o+=a.length}
  turnBuf=[];
  pnode.port.postMessage({t:'a',f:all},[all.buffer]);
}
function flushPlayback(){
  turnBuf=[];
  try{pnode&&pnode.port.postMessage({t:'c'})}catch(e){}
  speaking=false;
}
</script>
</body>
</html>
