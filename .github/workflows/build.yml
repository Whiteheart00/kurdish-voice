name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # هەر zip ـێک (تەنانەت zip ی ناو zip) دەکاتەوە تا settings.gradle.kts بدۆزێتەوە
      - name: Find or unpack the Gradle project
        run: |
          find_settings() {
            find "$1" -name settings.gradle.kts -not -path '*/.git/*' -not -path '*/node_modules/*' | head -1
          }
          F=$(find_settings .)
          if [ -z "$F" ]; then
            mkdir -p proj
            find . -maxdepth 1 -name '*.zip' -exec unzip -o -q {} -d proj \;
            for i in 1 2 3 4 5; do
              F=$(find_settings proj)
              [ -n "$F" ] && break
              find proj -name '*.zip' -print0 | while IFS= read -r -d '' z; do
                unzip -o -q "$z" -d "$(dirname "$z")" && rm -f "$z"
              done
            done
            F=$(find_settings proj)
          fi
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts not found anywhere in the repo or inside zip files"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          echo "DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Project dir: $(dirname "$F")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            plain=$(grep -E -B1 -A8 "^e: |\* What went wrong" build.log | head -60)
            if [ -z "$plain" ]; then plain=$(tail -40 build.log); fi
            enc=$(printf '%s' "$plain" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle error::$enc"
            { echo '### Gradle error'; echo '```'; echo "$plain"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Rename APK
        run: cp "${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk" "${{ env.DIR }}/KurdishTranslator.apk"

      - name: Upload full Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: ${{ env.DIR }}/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: KurdishTranslator-APK
          path: ${{ env.DIR }}/KurdishTranslator.apk
